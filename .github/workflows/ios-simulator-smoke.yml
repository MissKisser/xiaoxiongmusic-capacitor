name: iOS Simulator Smoke

on:
  workflow_dispatch:
    inputs:
      free_song_id:
        description: 免费歌曲 ID（缓存链路验证）
        default: '347230'
      vip_song_id:
        description: VIP 歌曲 ID（解锁链路验证，未登录走音源解锁）
        default: '186016'
      login_mode:
        description: 登录态注入模式（Secrets 的 MUSIC_U/CSRF 经 DEBUG 钩子写入模拟器，验证登录态功能）
        type: boolean
        default: false
  schedule:
    # 每周一 03:00 UTC（北京时间周一 11:00）定时冒烟，防 macos 镜像漂移
    - cron: '0 3 * * 1'

permissions:
  contents: write

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Simulator Smoke (boot/play/cache)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install UI automation tool (idb)
        run: |
          brew tap facebook/fb
          brew trust --formula facebook/fb/idb-companion || brew trust facebook/fb || true
          brew install idb-companion
          python3 -m pip install --break-system-packages fb-idb || python3 -m pip install fb-idb
          idb --help > /dev/null 2>&1 && echo "idb CLI ready"

      - name: Select available iPhone simulator
        id: device
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          DEVICE_NAME=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/^ *([^ ]+ [^(]+) \(.*/\1/' | xargs)
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $DEVICE_NAME ($DEVICE_ID)"

      - name: Build for simulator (Debug, unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.device.outputs.id }}" \
            -derivedDataPath build \
            -quiet CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Boot simulator and install app
        run: |
          xcrun simctl boot "${{ steps.device.outputs.id }}"
          xcrun simctl bootstatus "${{ steps.device.outputs.id }}" -b
          xcrun simctl install "${{ steps.device.outputs.id }}" build/Build/Products/Debug-iphonesimulator/App.app
          if [ "${{ inputs.login_mode }}" = "true" ]; then
            SIMCTL_CHILD_SIM_LOGIN_COOKIE="MUSIC_U=${{ secrets.NETEASE_MUSIC_U }}; __csrf=${{ secrets.NETEASE_CSRF }}" \
              xcrun simctl launch "${{ steps.device.outputs.id }}" com.xiaoxiong.music
          else
            xcrun simctl launch "${{ steps.device.outputs.id }}" com.xiaoxiong.music
          fi
          sleep 20
          mkdir -p artifacts
          xcrun simctl io "${{ steps.device.outputs.id }}" screenshot artifacts/01_home.png

      # 系统弹窗自动处理：优先 accessibility 树按 label 查找点击；
      # 兜底用比例坐标（系统弹窗按钮位置固定：Open 对话框 0.695/0.542，通知 Don't Allow 0.326/0.607）
      - name: Auto-dismiss system dialogs (helper script)
        run: |
          cat > tap_button.py <<'EOF'
          import json, subprocess, sys, time, os
          DEVICE = sys.argv[1]
          MODE = sys.argv[2]  # "label" 或 "coord"
          dump_path = os.environ.get("A11Y_DUMP", "")
          out = subprocess.run(["idb", "ui", "describe-all", "--udid", DEVICE],
                               capture_output=True, text=True, timeout=60)
          if dump_path:
              with open(dump_path, "w", encoding="utf-8", errors="replace") as f:
                  f.write(out.stdout[-200000:])
          elements = []
          try:
              parsed = json.loads(out.stdout)
              elements = parsed if isinstance(parsed, list) else parsed.get("elements", [parsed])
          except json.JSONDecodeError:
              for line in out.stdout.splitlines():
                  line = line.strip()
                  if line.startswith("{"):
                      try:
                          elements.append(json.loads(line))
                      except json.JSONDecodeError:
                          pass
          def tap(x_pt, y_pt):
              subprocess.run(["idb", "ui", "tap", str(int(x_pt)), str(int(y_pt)),
                              "--udid", DEVICE], check=True)
              time.sleep(3)
          if MODE == "coord":
              xf, yf = float(sys.argv[3]), float(sys.argv[4])
              # 从截图 PNG 真实分辨率推算逻辑点尺寸（iOS 模拟器 @3x）
              import struct
              png = subprocess.run(["xcrun", "simctl", "io", DEVICE, "screenshot",
                                    "/tmp/_dim.png"], capture_output=True, text=True)
              with open("/tmp/_dim.png", "rb") as fp:
                  hdr = fp.read(33)
              w_px, h_px = struct.unpack(">II", hdr[16:24])
              tap(xf * w_px / 3, yf * h_px / 3)
              print(f"coord tap at ({xf}, {yf}) -> ({xf*w_px/3:.0f},{yf*h_px/3:.0f})pt [{w_px}x{h_px}px]")
              sys.exit(0)
          LABELS = sys.argv[3].split("|")
          def find(label):
              # 先精确匹配（任意非容器类型），再退化为仅 Button 的子串匹配，
              # 避免误选 StaticText 标题（如 "Open in 小熊音乐?" 含 "Open"）
              for e in elements:
                  if str(e.get("AXLabel", "")) == label and str(e.get("type", "")) != "Alert":
                      f = e.get("frame", {})
                      return f.get("x", 0) + f.get("width", 0) / 2, f.get("y", 0) + f.get("height", 0) / 2
              for e in elements:
                  lab = str(e.get("AXLabel", ""))
                  if label.lower() in lab.lower() and str(e.get("type", "")) == "Button":
                      f = e.get("frame", {})
                      return f.get("x", 0) + f.get("width", 0) / 2, f.get("y", 0) + f.get("height", 0) / 2
              return None
          for attempt in range(3):
              target = None
              for label in LABELS:
                  target = find(label)
                  if target:
                      print(f"tap '{label}' at ({target[0]:.0f},{target[1]:.0f})")
                      tap(target[0], target[1])
                      break
              if not target:
                  print(f"attempt {attempt+1}: labels {LABELS} not found in a11y tree ({len(elements)} elements)")
                  break
              time.sleep(2)
          EOF
          echo "helper ready"

      - name: Dismiss notification permission dialog
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          # 弹窗出现时机不定，20 秒内多次重试
          for i in 1 2 3 4 5; do
            python3 tap_button.py "$DEVICE" label "Don't Allow|Allow" && break || true
            sleep 4
          done
          xcrun simctl io "$DEVICE" screenshot artifacts/01b_after_alerts.png || true

      # 首装用户协议：弹窗出现时机不定（约 20~60s），长窗口重试；
      # WebView 内容 a11y 暴露不完整，以滑动到底 + 同意按钮 label/坐标双点位点击
      - name: Accept user agreement (first launch)
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          for i in 1 2 3 4 5 6 7 8 9; do
            for j in 1 2 3; do
              idb ui swipe 201 620 201 160 --udid "$DEVICE" || true
              sleep 1
            done
            python3 tap_button.py "$DEVICE" label "同意" || true
            idb ui tap 201 699 --udid "$DEVICE" || true
            sleep 5
          done
          xcrun simctl io "$DEVICE" screenshot artifacts/01c_after_agreement.png || true

      # 登录测试模式：启动环境变量经 DEBUG 注入钩子写入影子库（MUSIC_U 来自 Secrets），
      # 此步仅做登录态验证（沙盒 Cookie 检出 + 截图），后续 VIP 歌步骤即为登录态复测
      - name: Verify injected login state
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.xiaoxiong.music data 2>/dev/null || true)
          FOUND=0
          for i in 1 2 3 4 5 6; do
            if [ -n "$DATA" ] && grep -rla "MUSIC_U" "$DATA/Library" 2>/dev/null | head -1 | grep -q .; then
              FOUND=1
              echo "登录态注入验证通过（MUSIC_U 已落地 Cookie 存储）"
              break
            fi
            echo "verify $i: Cookie 未检出，等待后重试"
            sleep 5
          done
          echo "LOGIN_FOUND=$FOUND" >> "$GITHUB_ENV"
          xcrun simctl io "$DEVICE" screenshot artifacts/05_login_verify.png || true

      # 登录态功能巡检：私人 FM（纯登录态功能）真实播放 + 个人主页用户数据渲染
      # a11y 取证 + 截图双重验证；坐标兜底基于 402x874pt（iPhone 16 Pro）
      - name: Logged-in feature sweep (FM / profile)
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          # 弹窗与协议均为延迟出现，巡检前先做一轮强制清理
          for i in 1 2 3; do
            python3 tap_button.py "$DEVICE" label "Don't Allow|Allow" || true
            for j in 1 2 3; do idb ui swipe 201 620 201 160 --udid "$DEVICE" || true; sleep 1; done
            python3 tap_button.py "$DEVICE" label "同意" || true
            idb ui tap 201 699 --udid "$DEVICE" || true
            sleep 3
          done
          A11Y_DUMP=artifacts/a11y_fm.json python3 tap_button.py "$DEVICE" label "私人FM"             || python3 tap_button.py "$DEVICE" coord 0.829 0.676 || true
          sleep 12
          xcrun simctl io "$DEVICE" screenshot artifacts/06_fm.png || true
          A11Y_DUMP=artifacts/a11y_profile.json python3 tap_button.py "$DEVICE" coord 0.901 0.1085 || true
          sleep 6
          xcrun simctl io "$DEVICE" screenshot artifacts/07_profile.png || true
          {
            echo "## 登录态功能巡检"
            echo ""
            echo "- 私人 FM 与个人主页截图见 artifacts（06_fm / 07_profile），a11y 树见 a11y_fm / a11y_profile"
          } >> "$GITHUB_STEP_SUMMARY"

      # 设置页巡检（登录态）：SIM_ROUTE 直达 /settings，全量下钻——
      # 应用设置→缓存/性能/更多（音频缓存值、检查更新隐藏）→歌词设置（桌面歌词隐藏）→播放设置（定时器/均衡器/引擎）
      - name: Settings page sweep
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          xcrun simctl terminate "$DEVICE" com.xiaoxiong.music || true
          sleep 2
          SIMCTL_CHILD_SIM_LOGIN_COOKIE="MUSIC_U=${{ secrets.NETEASE_MUSIC_U }}; __csrf=${{ secrets.NETEASE_CSRF }}"           SIMCTL_CHILD_SIM_ROUTE="#/settings"             xcrun simctl launch "$DEVICE" com.xiaoxiong.music
          sleep 15
          xcrun simctl io "$DEVICE" screenshot artifacts/08_settings_root.png || true
          # 应用设置 → 缓存/性能/更多（音频缓存设置值）
          idb ui tap 201 481 --udid "$DEVICE" || true
          sleep 4
          idb ui tap 201 402 --udid "$DEVICE" || true
          sleep 4
          xcrun simctl io "$DEVICE" screenshot artifacts/09_audio_cache.png || true
          idb ui swipe 201 640 201 200 --udid "$DEVICE" || true
          sleep 2
          xcrun simctl io "$DEVICE" screenshot artifacts/09_cache_more_1.png || true
          idb ui swipe 201 640 201 200 --udid "$DEVICE" || true
          sleep 2
          xcrun simctl io "$DEVICE" screenshot artifacts/09_cache_more_2.png || true
          # 返回两级到设置根 → 歌词设置（桌面歌词隐藏验证）
          idb ui tap 46 179 --udid "$DEVICE" || true
          sleep 2
          idb ui tap 46 179 --udid "$DEVICE" || true
          sleep 2
          idb ui tap 201 391 --udid "$DEVICE" || true
          sleep 4
          xcrun simctl io "$DEVICE" screenshot artifacts/10_lyric_1.png || true
          idb ui swipe 201 640 201 200 --udid "$DEVICE" || true
          sleep 2
          xcrun simctl io "$DEVICE" screenshot artifacts/10_lyric_2.png || true
          # 返回设置根 → 播放设置（定时器/均衡器/播放速度/AB 循环/引擎）
          idb ui tap 46 179 --udid "$DEVICE" || true
          sleep 2
          idb ui tap 201 300 --udid "$DEVICE" || true
          sleep 4
          xcrun simctl io "$DEVICE" screenshot artifacts/11_play_1.png || true
          idb ui swipe 201 640 201 200 --udid "$DEVICE" || true
          sleep 2
          xcrun simctl io "$DEVICE" screenshot artifacts/11_play_2.png || true

      # 登录测试模式：启动环境变量经 DEBUG 注入钩子写入影子库（MUSIC_U 来自 Secrets），
      # 此步仅做登录态验证（沙盒 Cookie 检出 + 截图），后续 VIP 歌步骤即为登录态复测
      - name: Verify injected login state
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.xiaoxiong.music data 2>/dev/null || true)
          FOUND=0
          for i in 1 2 3 4 5 6; do
            if [ -n "$DATA" ] && grep -rla "MUSIC_U" "$DATA/Library" 2>/dev/null | head -1 | grep -q .; then
              FOUND=1
              echo "登录态注入验证通过（MUSIC_U 已落地 Cookie 存储）"
              break
            fi
            echo "verify $i: Cookie 未检出，等待后重试"
            sleep 5
          done
          echo "LOGIN_FOUND=$FOUND" >> "$GITHUB_ENV"
          xcrun simctl io "$DEVICE" screenshot artifacts/05_login_verify.png || true

      # 登录态功能巡检：私人 FM（纯登录态功能）真实播放 + 个人主页用户数据渲染
      # a11y 取证 + 截图双重验证；坐标兜底基于 402x874pt（iPhone 16 Pro）
      - name: Logged-in feature sweep (FM / profile)
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          # 弹窗与协议均为延迟出现，巡检前先做一轮强制清理
          for i in 1 2 3; do
            python3 tap_button.py "$DEVICE" label "Don't Allow|Allow" || true
            for j in 1 2 3; do idb ui swipe 201 620 201 160 --udid "$DEVICE" || true; sleep 1; done
            python3 tap_button.py "$DEVICE" label "同意" || true
            idb ui tap 201 699 --udid "$DEVICE" || true
            sleep 3
          done
          A11Y_DUMP=artifacts/a11y_fm.json python3 tap_button.py "$DEVICE" label "私人FM"             || python3 tap_button.py "$DEVICE" coord 0.829 0.676 || true
          sleep 12
          xcrun simctl io "$DEVICE" screenshot artifacts/06_fm.png || true
          A11Y_DUMP=artifacts/a11y_profile.json python3 tap_button.py "$DEVICE" coord 0.901 0.1085 || true
          sleep 6
          xcrun simctl io "$DEVICE" screenshot artifacts/07_profile.png || true
          {
            echo "## 登录态功能巡检"
            echo ""
            echo "- 私人 FM 与个人主页截图见 artifacts（06_fm / 07_profile），a11y 树见 a11y_fm / a11y_profile"
          } >> "$GITHUB_STEP_SUMMARY"

      # 设置页巡检：terminate 后带 SIM_ROUTE 重启直达 /settings，分段截图全量设置项
      - name: Settings page sweep
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          xcrun simctl terminate "$DEVICE" com.xiaoxiong.music || true
          sleep 2
          SIMCTL_CHILD_SIM_LOGIN_COOKIE="MUSIC_U=${{ secrets.NETEASE_MUSIC_U }}; __csrf=${{ secrets.NETEASE_CSRF }}"           SIMCTL_CHILD_SIM_ROUTE="#/settings"             xcrun simctl launch "$DEVICE" com.xiaoxiong.music
          sleep 15
          for i in 1 2 3; do
            idb ui swipe 201 640 201 200 --udid "$DEVICE" || true
            sleep 2
            xcrun simctl io "$DEVICE" screenshot "artifacts/08_settings_$i.png" || true
          done
          # 应用设置子页：验证检查更新隐藏（P2-3）、缓存/性能/音源组渲染
          idb ui tap 201 481 --udid "$DEVICE" || true
          sleep 5
          xcrun simctl io "$DEVICE" screenshot artifacts/09_app_settings_1.png || true
          for i in 1 2 3; do
            idb ui swipe 201 640 201 200 --udid "$DEVICE" || true
            sleep 2
            xcrun simctl io "$DEVICE" screenshot "artifacts/09_app_settings_$((i+1)).png" || true
          done
          # 返回后进歌词设置子页：验证桌面歌词项隐藏（T2.7）
          idb ui swipe 8 400 320 400 --udid "$DEVICE" || true
          sleep 3
          idb ui tap 201 391 --udid "$DEVICE" || true
          sleep 5
          for i in 1 2 3; do
            idb ui swipe 201 640 201 200 --udid "$DEVICE" || true
            sleep 2
            xcrun simctl io "$DEVICE" screenshot "artifacts/10_lyric_settings_$i.png" || true
          done

      # 歌词/播放设置页直达（SIM_ROUTE）：桌面歌词隐藏验证（T2.7）+ 播放设置项渲染
      - name: Lyric and play settings pages
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          xcrun simctl terminate "$DEVICE" com.xiaoxiong.music || true
          sleep 2
          SIMCTL_CHILD_SIM_LOGIN_COOKIE="MUSIC_U=${{ secrets.NETEASE_MUSIC_U }}; __csrf=${{ secrets.NETEASE_CSRF }}"           SIMCTL_CHILD_SIM_ROUTE="#/settings/lyrics/display"             xcrun simctl launch "$DEVICE" com.xiaoxiong.music
          sleep 12
          xcrun simctl io "$DEVICE" screenshot artifacts/16_lyrics_display.png || true
          idb ui swipe 201 640 201 200 --udid "$DEVICE" || true
          sleep 2
          xcrun simctl io "$DEVICE" screenshot artifacts/16_lyrics_display_2.png || true
          xcrun simctl terminate "$DEVICE" com.xiaoxiong.music || true
          sleep 2
          SIMCTL_CHILD_SIM_LOGIN_COOKIE="MUSIC_U=${{ secrets.NETEASE_MUSIC_U }}; __csrf=${{ secrets.NETEASE_CSRF }}"           SIMCTL_CHILD_SIM_ROUTE="#/settings/play"             xcrun simctl launch "$DEVICE" com.xiaoxiong.music
          sleep 12
          xcrun simctl io "$DEVICE" screenshot artifacts/17_play_settings.png || true

      # 冷启动深链：terminate 后不经 launch 直接 openurl，验证 App 未运行时深链拉起并播放
      - name: Cold-start deep link
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          xcrun simctl terminate "$DEVICE" com.xiaoxiong.music || true
          sleep 2
          URL=$(python3 -c "import base64,json;print('orpheus://'+base64.b64encode(json.dumps({'type':'song','id':'${{ inputs.free_song_id || '347230' }}','cmd':'play'},separators=(',',':')).encode()).decode())")
          xcrun simctl openurl "$DEVICE" "$URL"
          # 系统确认框可能出现也可能已被记住：出现则点击 Open，不出现则 App 已直接拉起
          sleep 6
          A11Y_DUMP=artifacts/a11y_coldstart.json python3 tap_button.py "$DEVICE" label "Open" \
            || python3 tap_button.py "$DEVICE" coord 0.695 0.542 || true
          sleep 30
          xcrun simctl io "$DEVICE" screenshot artifacts/12_coldstart.png || true

      - name: Play free song via deep link
        run: |
          URL=$(python3 -c "import base64,json;print('orpheus://'+base64.b64encode(json.dumps({'type':'song','id':'${{ inputs.free_song_id || '347230' }}','cmd':'play'},separators=(',',':')).encode()).decode())")
          echo "Deep link: $URL"
          xcrun simctl openurl "${{ steps.device.outputs.id }}" "$URL"
          sleep 4
          A11Y_DUMP=artifacts/a11y_open1.json python3 tap_button.py "${{ steps.device.outputs.id }}" label "Open" \
            || python3 tap_button.py "${{ steps.device.outputs.id }}" coord 0.695 0.542 || true
          sleep 30
          xcrun simctl io "${{ steps.device.outputs.id }}" screenshot artifacts/02_free_song.png

      - name: Play VIP song via deep link
        run: |
          URL=$(python3 -c "import base64,json;print('orpheus://'+base64.b64encode(json.dumps({'type':'song','id':'${{ inputs.vip_song_id || '186016' }}','cmd':'play'},separators=(',',':')).encode()).decode())")
          echo "Deep link: $URL"
          xcrun simctl openurl "${{ steps.device.outputs.id }}" "$URL"
          sleep 4
          A11Y_DUMP=artifacts/a11y_open2.json python3 tap_button.py "${{ steps.device.outputs.id }}" label "Open" \
            || python3 tap_button.py "${{ steps.device.outputs.id }}" coord 0.695 0.542 || true
          sleep 40
          xcrun simctl io "${{ steps.device.outputs.id }}" screenshot artifacts/03_vip_song.png

      - name: Replay free song (cache hit path)
        run: |
          URL=$(python3 -c "import base64,json;print('orpheus://'+base64.b64encode(json.dumps({'type':'song','id':'${{ inputs.free_song_id || '347230' }}','cmd':'play'},separators=(',',':')).encode()).decode())")
          xcrun simctl openurl "${{ steps.device.outputs.id }}" "$URL"
          sleep 4
          python3 tap_button.py "${{ steps.device.outputs.id }}" coord 0.695 0.542 || true
          sleep 15
          xcrun simctl io "${{ steps.device.outputs.id }}" screenshot artifacts/04_free_replay.png

      # 收藏红心（登录态鉴权交互）：先深链拉起播放与迷你条，截 tap 前状态，
      # 单次点击红心后截图对比（两次点击会翻转两次，无法证明状态变化）
      - name: Tap favorite heart
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          URL=$(python3 -c "import base64,json;print('orpheus://'+base64.b64encode(json.dumps({'type':'song','id':'${{ inputs.vip_song_id || '186016' }}','cmd':'play'},separators=(',',':')).encode()).decode())")
          xcrun simctl openurl "$DEVICE" "$URL"
          sleep 4
          python3 tap_button.py "$DEVICE" coord 0.695 0.542 || true
          sleep 16
          xcrun simctl io "$DEVICE" screenshot artifacts/13_heart_before.png || true
          A11Y_DUMP=artifacts/a11y_heart.json python3 tap_button.py "$DEVICE" coord 0.734 0.880 || true
          sleep 3
          xcrun simctl io "$DEVICE" screenshot artifacts/13_heart.png || true

      # 睡眠定时器（P1-5）：a11y label 点击 10min 档位并截图选中态，
      # 重启回定时器页验证设置持久化；到点暂停需 ≥10min 真实等待，CI 不验证
      - name: Sleep timer verification
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          xcrun simctl terminate "$DEVICE" com.xiaoxiong.music || true
          sleep 2
          SIMCTL_CHILD_SIM_LOGIN_COOKIE="MUSIC_U=${{ secrets.NETEASE_MUSIC_U }}; __csrf=${{ secrets.NETEASE_CSRF }}"           SIMCTL_CHILD_SIM_ROUTE="#/settings/play/timer"             xcrun simctl launch "$DEVICE" com.xiaoxiong.music
          sleep 12
          xcrun simctl io "$DEVICE" screenshot artifacts/15_timer_page.png || true
          python3 tap_button.py "$DEVICE" coord 0.1866 0.3121 || true
          sleep 2
          xcrun simctl io "$DEVICE" screenshot artifacts/15_timer_set.png || true
          xcrun simctl terminate "$DEVICE" com.xiaoxiong.music || true
          sleep 2
          SIMCTL_CHILD_SIM_LOGIN_COOKIE="MUSIC_U=${{ secrets.NETEASE_MUSIC_U }}; __csrf=${{ secrets.NETEASE_CSRF }}"           SIMCTL_CHILD_SIM_ROUTE="#/settings/play/timer"             xcrun simctl launch "$DEVICE" com.xiaoxiong.music
          sleep 12
          xcrun simctl io "$DEVICE" screenshot artifacts/15_timer_persist.png || true

      # 睡眠定时器到点暂停（P1-5 行为断言）：10min 档 arm 原生定时器 → 深链起播 →
      # 等 630s（600s 档位 + 30s 余量）断言播放图标翻转 + 原生到点日志 + 重启后状态清零
      - name: Sleep timer fire (10 min wait)
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          xcrun simctl terminate "$DEVICE" com.xiaoxiong.music || true
          sleep 2
          SIMCTL_CHILD_SIM_LOGIN_COOKIE="MUSIC_U=${{ secrets.NETEASE_MUSIC_U }}; __csrf=${{ secrets.NETEASE_CSRF }}"           SIMCTL_CHILD_SIM_ROUTE="#/settings/play/timer"             xcrun simctl launch "$DEVICE" com.xiaoxiong.music
          sleep 12
          xcrun simctl io "$DEVICE" screenshot artifacts/18_timer_arm_page.png || true
          python3 tap_button.py "$DEVICE" coord 0.1866 0.3121 || true
          sleep 2
          xcrun simctl io "$DEVICE" screenshot artifacts/18_timer_armed.png || true
          URL=$(python3 -c "import base64,json;print('orpheus://'+base64.b64encode(json.dumps({'type':'song','id':'${{ inputs.vip_song_id || '186016' }}','cmd':'play'},separators=(',',':')).encode()).decode())")
          xcrun simctl openurl "$DEVICE" "$URL"
          sleep 4
          python3 tap_button.py "$DEVICE" coord 0.695 0.542 || true
          sleep 16
          xcrun simctl io "$DEVICE" screenshot artifacts/18_timer_before.png || true
          echo "定时器已 arm（10min），等待 630 秒到点..."
          sleep 630
          xcrun simctl io "$DEVICE" screenshot artifacts/18_timer_after.png || true
          xcrun simctl spawn "$DEVICE" log show --last 14m --info --debug --style compact             --predicate 'process == "App"' > artifacts/timer_fire_console.log 2>&1 || true
          if grep -q "睡眠定时器到点" artifacts/timer_fire_console.log; then
            echo "✅ 原生定时器到点日志命中"
          else
            echo "⚠️ 原生定时器到点日志未检出"
          fi
          xcrun simctl terminate "$DEVICE" com.xiaoxiong.music || true
          sleep 2
          SIMCTL_CHILD_SIM_LOGIN_COOKIE="MUSIC_U=${{ secrets.NETEASE_MUSIC_U }}; __csrf=${{ secrets.NETEASE_CSRF }}"           SIMCTL_CHILD_SIM_ROUTE="#/settings/play/timer"             xcrun simctl launch "$DEVICE" com.xiaoxiong.music
          sleep 12
          xcrun simctl io "$DEVICE" screenshot artifacts/20_timer_reset.png || true

      # 加分项（waitSongEnd）：自定义 1 分钟 + 勾选等待曲终 → 到点后歌曲应继续播放
      # 自定义输入无确认按钮（输入即生效）；曲终自动暂停受歌长限制不等待，如实记录
      - name: Sleep timer waitSongEnd (bonus)
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          xcrun simctl terminate "$DEVICE" com.xiaoxiong.music || true
          sleep 2
          SIMCTL_CHILD_SIM_LOGIN_COOKIE="MUSIC_U=${{ secrets.NETEASE_MUSIC_U }}; __csrf=${{ secrets.NETEASE_CSRF }}"           SIMCTL_CHILD_SIM_ROUTE="#/settings/play/timer"             xcrun simctl launch "$DEVICE" com.xiaoxiong.music
          sleep 12
          xcrun simctl io "$DEVICE" screenshot artifacts/21_wse_page.png || true
          idb ui tap 201 443 --udid "$DEVICE" || true
          sleep 2
          idb ui tap 201 487 --udid "$DEVICE" || true
          sleep 1
          idb ui text "1" --udid "$DEVICE" || true
          sleep 2
          idb ui tap 201 505 --udid "$DEVICE" || true
          sleep 2
          xcrun simctl io "$DEVICE" screenshot artifacts/21_wse_armed.png || true
          URL=$(python3 -c "import base64,json;print('orpheus://'+base64.b64encode(json.dumps({'type':'song','id':'${{ inputs.free_song_id || '347230' }}','cmd':'play'},separators=(',',':')).encode()).decode())")
          xcrun simctl openurl "$DEVICE" "$URL"
          sleep 4
          python3 tap_button.py "$DEVICE" coord 0.695 0.542 || true
          sleep 16
          xcrun simctl io "$DEVICE" screenshot artifacts/21_wse_before.png || true
          echo "等待 90 秒验证 1 分钟定时器到点后歌曲继续..."
          sleep 90
          xcrun simctl io "$DEVICE" screenshot artifacts/21_wse_after.png || true
          xcrun simctl spawn "$DEVICE" log show --last 5m --info --debug --style compact             --predicate 'process == "App"' > artifacts/wse_console.log 2>&1 || true
          grep -q "睡眠定时器到点" artifacts/wse_console.log && echo "waitSongEnd 到点事件命中" || echo "waitSongEnd 到点事件未检出"

      # Cookie 自然持久化（P4-1）：不带注入环境变量重启，验证登录态由 App 自身持久化保持
      - name: Cookie persistence check (no injection)
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          xcrun simctl terminate "$DEVICE" com.xiaoxiong.music || true
          sleep 2
          xcrun simctl launch "$DEVICE" com.xiaoxiong.music
          sleep 15
          xcrun simctl io "$DEVICE" screenshot artifacts/14_persistence.png || true
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.xiaoxiong.music data 2>/dev/null || true)
          grep -rla "MUSIC_U" "$DATA/Library" 2>/dev/null | head -1 | grep -q . && echo "Cookie 存储中 MUSIC_U 仍在" || echo "警告: MUSIC_U 未检出"

      # AppIcon SpringBoard 截图（P3-2）：terminate 后回落桌面，图标渲染即闭环缺口
      - name: SpringBoard icon screenshot
        if: ${{ inputs.login_mode == true }}
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          xcrun simctl terminate "$DEVICE" com.xiaoxiong.music || true
          sleep 3
          xcrun simctl io "$DEVICE" screenshot artifacts/19_springboard.png || true

      - name: Collect evidence (cache / process / logs)
        if: always()
        run: |
          DEVICE="${{ steps.device.outputs.id }}"
          DATA_DIR=$(xcrun simctl get_app_container "$DEVICE" com.xiaoxiong.music data 2>/dev/null || true)
          echo "=== App data container: $DATA_DIR ===" | tee artifacts/cache_report.txt
          if [ -n "$DATA_DIR" ] && [ -d "$DATA_DIR/Library/Caches/audio_cache" ]; then
            ls -la "$DATA_DIR/Library/Caches/audio_cache" | tee -a artifacts/cache_report.txt
          else
            echo "audio_cache 目录不存在或为空（可能未触发缓存或 App 未运行）" | tee -a artifacts/cache_report.txt
          fi
          echo "=== App 进程存活检查 ===" | tee -a artifacts/cache_report.txt
          xcrun simctl spawn "$DEVICE" launchctl list 2>/dev/null | grep -i "com.xiaoxiong" | tee -a artifacts/cache_report.txt || echo "进程未在运行（可能已崩溃或被系统回收）" | tee -a artifacts/cache_report.txt
          xcrun simctl spawn "$DEVICE" log show --last 20m --info --debug --style compact --predicate 'process == "App" OR processImagePath CONTAINS "WebKit.Networking"' > artifacts/app_console.log 2>&1 || true
          grep -avE "CoreHaptics|WebPrivacy|app_launch|XPCErrors|TextInputUI|extensionkit|AppSSO|ScreenTime|UIKBFeedback" artifacts/app_console.log | grep -aiE "⚡️|orpheus|capacitor-audio|audio|proxy|CORS|❌|Unblock|songDetail|playStatus|media" | head -120 > artifacts/error_lines.log || true

      - name: Smoke verdict
        run: |
          CACHE_HITS=$(grep -cE "\.cache|\.tmp" artifacts/cache_report.txt || true)
          ALIVE=$(grep -c "com.xiaoxiong" artifacts/cache_report.txt || true)
          {
            echo "## 模拟器冒烟结果"
            echo ""
            echo "| 信号 | 结果 |"
            echo "|---|---|"
            echo "| App 进程 | $([ "$ALIVE" -gt 0 ] && echo '✅ 存活' || echo '❌ 未运行') |"
            echo "| 缓存文件落地 | $([ "$CACHE_HITS" -gt 0 ] && echo "✅ ${CACHE_HITS} 个文件" || echo '❌ 无') |"
            echo ""
            echo "详细证据见 artifacts（截图 01~04、cache_report、app_console.log、error_lines.log）"
          } >> "$GITHUB_STEP_SUMMARY"
          # 基线期不硬失败，只报告；链路调稳后改为硬门禁
          exit 0

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke-${{ github.run_number }}
          path: artifacts/
          retention-days: 7
