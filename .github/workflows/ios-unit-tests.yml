name: iOS Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
  pull_request:
    paths:
      - 'ios/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CapApp-SPM Unit Tests
    # 无坐标依赖，跟随 _latest；测试入口依赖仓库内共享 scheme（.swiftpm/xcschemes），
    # 不依赖 Xcode 自动生成（Xcode 26 起 CLI 不再为 SPM 包生成 scheme）
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 包内 testTarget 依赖 node_modules 下的本地 path 插件包，需先安装依赖；
      # 依赖升级分支（如 capacitor 组 bump）需重建 web 资产与 iOS 同步产物后 SPM 才能解析
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor iOS
        run: |
          pnpm build
          npx cap sync ios

      - name: Select available iPhone simulator
        id: device
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::未找到可用 iPhone 模拟器，请检查 runner 镜像设备列表" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $DEVICE_ID"

      - name: Run package unit tests on iOS simulator
        working-directory: ios/App/CapApp-SPM
        run: |
          set -uo pipefail
          DEST="platform=iOS Simulator,id=${{ steps.device.outputs.id }}"
          # 包模式下 name 型 destination 依赖 buildable 平台解析（不可靠），UDID 直达设备
          if xcodebuild test -scheme CapApp-SPM -destination "$DEST" -quiet; then
            echo "共享 scheme 路径通过"
            exit 0
          fi
          echo "=== 共享 scheme 失败，退回自动 scheme 重试 ==="
          rm -rf .swiftpm
          xcodebuild -list
          xcodebuild test -scheme CapApp-SPM -destination "$DEST"
