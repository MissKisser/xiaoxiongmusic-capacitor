name: iOS Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CapApp-SPM Unit Tests
    # 无坐标依赖，跟随 _latest；Xcode 26 的包自动 scheme 含 test action
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 包内 testTarget 依赖 node_modules 下的本地 path 插件包，需先安装依赖；
      # 依赖升级分支（如 capacitor 组 bump）需重建 web 资产与 iOS 同步产物后 SPM 才能解析
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor iOS
        run: |
          pnpm build
          npx cap sync ios

      - name: Select available iPhone simulator
        id: device
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $DEVICE_ID"

      - name: Run package unit tests
        run: |
          cd ios/App/CapApp-SPM
          echo "=== 可用 schemes ==="
          xcodebuild -list 2>&1 | tee /tmp/schemes.txt
          SCHEMES=$(sed -n '/Schemes:/,$p' /tmp/schemes.txt | grep -E '^[[:space:]]{4}[^[:space:]]' | sed 's/^ *//;s/ *$//')
          if [ -z "$SCHEMES" ]; then
            echo "::error::包无可用 scheme"; exit 1
          fi
          for SCHEME in $SCHEMES; do
            echo "=== 尝试 scheme: $SCHEME ==="
            if xcodebuild test \
              -scheme "$SCHEME" \
              -destination "platform=iOS Simulator,id=${{ steps.device.outputs.id }}" \
              -quiet; then
              echo "✅ 测试经 scheme '$SCHEME' 通过"; exit 0
            fi
          done
          echo "::error::所有 scheme 均未配置可用的 test action"
          exit 1
