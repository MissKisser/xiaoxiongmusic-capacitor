name: iOS Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
  pull_request:
    paths:
      - 'ios/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CapApp-SPM Unit Tests
    # 无坐标依赖，跟随 _latest；scheme 依赖 Package.swift 内 testTarget 声明（sync 后补回）
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 包内 testTarget 依赖 node_modules 下的本地 path 插件包，需先安装依赖；
      # 依赖升级分支（如 capacitor 组 bump）需重建 web 资产与 iOS 同步产物后 SPM 才能解析
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor iOS
        run: |
          pnpm build
          npx cap sync ios

      - name: Run package unit tests on iOS simulator
        run: |
          set -euo pipefail
          # cap sync 按模板重写 Package.swift 时会丢弃 testTarget 声明，测试前补回（幂等）
          if ! grep -q "testTarget" ios/App/CapApp-SPM/Package.swift; then
            perl -0pi -e 's/\n        \)\n    \]\n\)/\n        ),\n        .testTarget(\n            name: "CapApp-SPMTests",\n            dependencies: ["CapApp-SPM"]\n        )\n    ]\n)/' ios/App/CapApp-SPM/Package.swift
          fi
          grep -q "testTarget" ios/App/CapApp-SPM/Package.swift || {
            echo "::error::testTarget 补回失败，请检查 cap sync 生成的 Package.swift 结构" >&2
            exit 1
          }
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::未找到可用 iPhone 模拟器，请检查 runner 镜像设备列表" >&2
            exit 1
          fi
          echo "Selected simulator: $DEVICE_ID"
          cd ios/App/CapApp-SPM
          xcodebuild test \
            -scheme CapApp-SPM \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -quiet
