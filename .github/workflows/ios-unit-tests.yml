name: iOS Unit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CapApp-SPM Unit Tests
    # 无坐标依赖，跟随 _latest；Xcode 26 的包自动 scheme 含 test action
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 包内 testTarget 依赖 node_modules 下的本地 path 插件包，需先安装依赖；
      # 依赖升级分支（如 capacitor 组 bump）需重建 web 资产与 iOS 同步产物后 SPM 才能解析
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor iOS
        run: |
          pnpm build
          npx cap sync ios

      - name: Run package unit tests on iOS simulator
        run: |
          # Xcode 26 起不再为 SPM 包自动生成含 test action 的 scheme，
          # 改用 swift test 的 destination 描述文件直跑 iOS 模拟器（swift.org CI 文档模式）
          cat > /tmp/dest.json <<EOF
          {
            "version": 1,
            "sdkRoot": "$(xcrun --sdk iphonesimulator --show-sdk-path)",
            "targetPlatform": "ios",
            "arch": "$(uname -m)"
          }
          EOF
          cd ios/App/CapApp-SPM
          swift test --destination /tmp/dest.json
